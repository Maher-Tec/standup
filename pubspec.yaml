name: standup_pet
description: StandUp desktop pet for Windows, drawn with Flutter CustomPainter.
publish_to: none
version: 4.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.4.3
  shared_preferences: ^2.3.2
  tray_manager: ^0.2.3
  screen_retriever: 0.2.2
  audioplayers: ^6.1.0
flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/tray/
dev_dependencies:
  flutter_lints: ^6.0.0
